apiVersion: 1

policies:
  - receiver: Slack-Critical-Alerts
    groupBy:
      - alertname
      - namespace
      - cluster
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: Slack-Critical-Alerts
        object_matchers:
          - ["severity", "=", "critical"]
        continue: true

      - receiver: Email-OnCall-SRE
        object_matchers:
          - ["severity", "=", "critical"]
        continue: true

      - receiver: MS-Teams-Ops
        object_matchers:
          - ["severity", "=", "warning"]
        continue: false

      - receiver: Discord-Devops
        object_matchers:
          - ["category", "=", "gitops"]
        continue: false
