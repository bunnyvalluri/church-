[paths]
data = /var/lib/grafana/data
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_port = 3000
domain = grafana.kcmchurch.org
root_url = https://grafana.kcmchurch.org/
router_logging = false
enable_gzip = true
enforce_domain = false

[database]
type = postgres
host = kcm-postgresql.monitoring.svc.cluster.local:5432
name = grafana_db
user = grafana_user
# Password provided via GF_DATABASE_PASSWORD env var
ssl_mode = disable
max_idle_conn = 10
max_open_conn = 100
conn_max_lifetime = 14400
log_queries = false

[remote_cache]
type = redis
connstr = addr=kcm-redis.monitoring.svc.cluster.local:6379,db=1,pool_size=100,prefix=grafana:

[session]
provider = redis
provider_config = addr=kcm-redis.monitoring.svc.cluster.local:6379,db=1,pool_size=100,prefix=grafana:session:
cookie_name = kcm_grafana_sess
cookie_secure = true
session_life_time = 86400

[security]
admin_user = kcm_admin
# Admin password supplied via GF_SECURITY_ADMIN_PASSWORD env var
disable_initial_admin_creation = false
cookie_secure = true
cookie_samesite = lax
allow_embedding = false
strict_transport_security = true
strict_transport_security_max_age_seconds = 31536000
strict_transport_security_subdomains = true
strict_transport_security_preload = true
x_content_type_options = true
x_xss_protection = true
angular_support_enabled = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark

[auth]
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
enabled = false

[auth.generic_oauth]
enabled = true
name = KCM OAuth
allow_sign_up = true
client_id = ${OAUTH_CLIENT_ID}
client_secret = ${OAUTH_CLIENT_SECRET}
scopes = openid profile email
auth_url = https://identity.kcmchurch.org/oauth2/authorize
token_url = https://identity.kcmchurch.org/oauth2/token
api_url = https://identity.kcmchurch.org/oauth2/userinfo
role_attribute_path = contains(groups[*], 'kcm-admins') && 'Admin' || contains(groups[*], 'kcm-devops') && 'Editor' || 'Viewer'

[analytics]
reporting_enabled = false
check_for_updates = false

[metrics]
enabled = true
basic_auth_username = metrics
# Basic auth password set via GF_METRICS_BASIC_AUTH_PASSWORD

[log]
mode = console
level = info

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/cluster-overview.json
