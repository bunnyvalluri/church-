# Gitleaks Configuration for Kingdom of Christ Ministries (KCM) Portal
title = "KCM Security Secret Scanning Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlists for sanitized example configurations, tests, historical audit reports, and false positives"
paths = [
  '''^\.env\.example$''',
  '''^frontend/\.env\.example$''',
  '''^backend/\.env\.example$''',
  '''^\.keyfinderignore\.json$''',
  '''keyfinder-findings.*''',
  '''^docs/SECRET_AUDIT\.md$''',
  '''^docs/SECRET_REMEDIATION\.md$''',
  '''^docs/SECRET_REMEDIATION_REPORT\.md$''',
  '''^docs/RAZORPAY-INTEGRATION\.md$''',
  '''^frontend/texts/email/.*''',
  '''^reports/''',
  '''^health/reports/''',
  '''^package-lock\.json$''',
  '''^pnpm-lock\.yaml$''',
  '''^yarn\.lock$'''
]

