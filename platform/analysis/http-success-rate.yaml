apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: http-success-rate
  namespace: kcm-system
  labels:
    app.kubernetes.io/name: http-success-rate
    app.kubernetes.io/part-of: kcm-progressive-delivery
spec:
  args:
    - name: service-name
    - name: namespace
      value: kcm-system
  metrics:
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.995
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{namespace="{{args.namespace}}",service="{{args.service-name}}",status!~"5.*"}[2m]))
            /
            sum(rate(http_requests_total{namespace="{{args.namespace}}",service="{{args.service-name}}"}[2m]))
