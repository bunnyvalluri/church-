# ==============================================================================
# Kingdom of Christ Ministries — GatewayClass
# ==============================================================================
# GatewayClass is a cluster-scoped resource that defines a class of Gateways.
# This references the Envoy Gateway controller installed in envoy-gateway-system.
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kcm-gateway-class
  labels:
    app.kubernetes.io/name: kcm-gateway-class
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: kcm-church-portal
    app.kubernetes.io/managed-by: helm
  annotations:
    meta.helm.sh/release-name: kcm-gateway
    meta.helm.sh/release-namespace: kcm-system
    description: "KCM Church production GatewayClass using Envoy Gateway v1.8.3"
spec:
  # Must match the controller name set in Envoy Gateway config
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # Reference to EnvoyProxy custom configuration
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kcm-proxy-config
    namespace: envoy-gateway-system
  description: |
    KCM Church Enterprise Gateway Class powered by Envoy Gateway v1.8.3.
    Provides HTTP/HTTPS routing, TLS termination, traffic management,
    security policies, and observability for all KCM portals.
