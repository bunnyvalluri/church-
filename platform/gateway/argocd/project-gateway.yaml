# ==============================================================================
# Kingdom of Christ Ministries — Argo CD AppProject: Gateway (Phase 12)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kcm-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/name: kcm-gateway
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kcm-church-portal
  annotations:
    description: "KCM Enterprise Gateway Platform — all Gateway API resources"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "KCM Church Enterprise Gateway Platform using Envoy Gateway v1.8.3"

  # ── Source Repositories ──────────────────────────────────────────────────────
  sourceRepos:
    - "https://github.com/bunnyvalluri/church-.git"
    - "oci://docker.io/envoyproxy/gateway-helm"

  # ── Destination Clusters/Namespaces ──────────────────────────────────────────
  destinations:
    - server: "https://kubernetes.default.svc"
      namespace: envoy-gateway-system
    - server: "https://kubernetes.default.svc"
      namespace: kcm-system
    - server: "https://kubernetes.default.svc"
      namespace: monitoring
    - server: "https://kubernetes.default.svc"
      namespace: cert-manager

  # ── Allowed Resource Kinds ────────────────────────────────────────────────────
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "gateway.networking.k8s.io"
      kind: GatewayClass
    - group: "gateway.envoyproxy.io"
      kind: EnvoyProxy
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "cert-manager.io"
      kind: ClusterIssuer

  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: "apps"
      kind: "*"
    - group: "gateway.networking.k8s.io"
      kind: "*"
    - group: "gateway.envoyproxy.io"
      kind: "*"
    - group: "cert-manager.io"
      kind: "*"
    - group: "monitoring.coreos.com"
      kind: "*"
    - group: "argoproj.io"
      kind: "*"
    - group: "networking.k8s.io"
      kind: NetworkPolicy
    - group: "rbac.authorization.k8s.io"
      kind: "*"
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler

  # ── Sync Windows ──────────────────────────────────────────────────────────────
  syncWindows:
    - kind: allow
      schedule: "* * * * *"  # Allow sync always
      duration: "24h"
      applications: ["*"]
      manualSync: true
    - kind: deny
      schedule: "0 8-18 * * 1-5"  # Deny auto-sync during Sunday service hours (IST)
      duration: "3h"
      namespaces: ["kcm-system"]

  # ── RBAC Roles within the project ────────────────────────────────────────────
  roles:
    - name: gateway-admin
      description: "Full access to KCM Gateway project"
      policies:
        - "p, proj:kcm-gateway:gateway-admin, applications, *, kcm-gateway/*, allow"
      groups:
        - "kcm-platform-team"
    - name: gateway-viewer
      description: "Read-only access to KCM Gateway project"
      policies:
        - "p, proj:kcm-gateway:gateway-viewer, applications, get, kcm-gateway/*, allow"
      groups:
        - "kcm-devs"
