# ==============================================================================
# Kingdom of Christ Ministries — Traffic Mirroring
# ==============================================================================
# Mirrors a percentage of production traffic to the canary service for
# shadow testing without impacting real users.
# This is separate from Argo Rollouts weighted canary (which affects real users).
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kcm-traffic-mirror
  namespace: kcm-system
  labels:
    app.kubernetes.io/name: kcm-traffic-mirror
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: kcm-church-portal
  annotations:
    description: "Shadow traffic mirroring to canary — for testing without user impact"
    # Set enabled: false annotation to disable mirroring when not needed
    traffic-mirror.kcm/enabled: "false"  # Disabled by default — enable during testing
spec:
  parentRefs:
    - name: kcm-gateway
      namespace: kcm-system
      sectionName: https

  hostnames:
    - "kcmchurch.org"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
          # Only mirror API traffic, not static assets
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: frontend-canary-service
              port: 3000
            percent: 10  # Mirror 10% of API traffic to canary
      backendRefs:
        - name: frontend-stable-service
          port: 3000
          weight: 100
