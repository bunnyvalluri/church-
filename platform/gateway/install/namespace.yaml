# ==============================================================================
# Kingdom of Christ Ministries — Envoy Gateway System Namespace
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-gateway-system
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: kcm-church-portal
    app.kubernetes.io/managed-by: helm
    kubernetes.io/metadata.name: envoy-gateway-system
    # Pod Security Standards — enforce restricted for gateway namespace
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.29
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Environment label
    environment: production
    # Network policy selector
    network-policy: gateway-system
  annotations:
    meta.helm.sh/release-name: envoy-gateway
    meta.helm.sh/release-namespace: envoy-gateway-system
    description: "Envoy Gateway controller namespace for KCM Church portal"
