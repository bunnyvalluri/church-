# ==============================================================================
# Kingdom of Christ Ministries — JWT SecurityPolicy: Protected Portals (Ph 10)
# ==============================================================================

# ── Admin Portal JWT Policy ────────────────────────────────────────────────
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kcm-admin-jwt-policy
  namespace: kcm-system
  labels:
    app.kubernetes.io/name: kcm-admin-jwt-policy
    app.kubernetes.io/component: security
    portal: admin
    app.kubernetes.io/part-of: kcm-church-portal
  annotations:
    description: "JWT auth enforcement for Admin portal"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kcm-admin-route

  jwt:
    providers:
      - name: firebase-auth
        issuer: "https://securetoken.google.com/kcm-church-portal"
        audiences:
          - "kcm-church-portal"
        remoteJWKS:
          uri: "https://www.googleapis.com/robot/v1/metadata/jwk/securetoken@system.gserviceaccount.com"
        claimToHeaders:
          - claim: sub
            header: X-User-ID
          - claim: email
            header: X-User-Email
          - claim: "custom:role"
            header: X-User-Role
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
          cookies:
            - "firebase-auth-token"
---
