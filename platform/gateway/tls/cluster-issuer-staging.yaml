# ==============================================================================
# Kingdom of Christ Ministries — Let's Encrypt Staging ClusterIssuer
# ==============================================================================
# Use staging first to validate ACME challenge configuration.
# Staging certs are NOT trusted by browsers — for testing only.
# Once validated, switch to the production issuer.
# ==============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: letsencrypt-staging
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: kcm-church-portal
    app.kubernetes.io/managed-by: helm
  annotations:
    description: "Let's Encrypt staging ACME issuer — for testing only"
spec:
  acme:
    # Let's Encrypt staging endpoint
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # ⚠️ REPLACE with real admin email address
    email: admin@kcmchurch.org
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      # HTTP-01 challenge — requires port 80 to be accessible from internet
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: kcm-gateway
                namespace: kcm-system
                kind: Gateway
