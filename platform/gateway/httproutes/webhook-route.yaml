# ==============================================================================
# Kingdom of Christ Ministries — Webhook HTTPRoute
# ==============================================================================
# Routes: api.kcmchurch.org /api/webhooks/* → backend-api-service:3001
# Public route (no JWT required) — webhook payloads are verified by HMAC in app
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kcm-webhook-route
  namespace: kcm-system
  labels:
    app.kubernetes.io/name: kcm-webhook-route
    app.kubernetes.io/component: routing
    app.kubernetes.io/part-of: kcm-church-portal
  annotations:
    description: "Webhook routes for Firebase, Stripe, and other external services"
    security: "public-hmac-verified"
spec:
  parentRefs:
    - name: kcm-gateway
      namespace: kcm-system
      sectionName: https-api

  hostnames:
    - "api.kcmchurch.org"

  rules:
    # ── Firebase Auth Webhooks ─────────────────────────────────────────────────
    - matches:
        - path:
            type: PathPrefix
            value: /api/webhooks/firebase
          headers:
            - name: "Content-Type"
              value: "application/json"
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Proto
                value: "https"
              - name: X-Webhook-Source
                value: "firebase"
      backendRefs:
        - name: backend-api-active-service
          port: 3001
          weight: 100
      timeouts:
        request: 30s

    # ── Generic Webhook Route ─────────────────────────────────────────────────
    - matches:
        - path:
            type: PathPrefix
            value: /api/webhooks
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Proto
                value: "https"
      backendRefs:
        - name: backend-api-active-service
          port: 3001
          weight: 100
      timeouts:
        request: 60s
        backendRequest: 55s
