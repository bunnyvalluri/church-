# ==============================================================================
# Kingdom of Christ Ministries — WebSocket HTTPRoute
# ==============================================================================
# Routes: api.kcmchurch.org /socket.io/* → backend-socket-service:3001
# WebSocket upgrade is handled natively by Envoy Gateway (HTTP/1.1 Upgrade)
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kcm-websocket-route
  namespace: kcm-system
  labels:
    app: kcm-backend-socket
    app.kubernetes.io/name: kcm-websocket-route
    app.kubernetes.io/component: routing
    app.kubernetes.io/part-of: kcm-church-portal
    app.kubernetes.io/managed-by: helm
  annotations:
    description: "KCM Church WebSocket/Socket.IO routing"
spec:
  parentRefs:
    - name: kcm-gateway
      namespace: kcm-system
      sectionName: https-api

  hostnames:
    - "api.kcmchurch.org"

  rules:
    # ── Socket.IO WebSocket Route ─────────────────────────────────────────────
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Proto
                value: "https"
      backendRefs:
        - name: backend-socket-service
          port: 3001
          weight: 100
      # WebSocket connections can be long-lived — set generous timeouts
      timeouts:
        request: 3600s   # 1 hour for long-lived WS connections
        backendRequest: 3600s
