apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-schedules-and-storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: velero-schedules
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kcm-platform
spec:
  project: default
  source:
    repoURL: https://github.com/bunnyvalluri/church-.git
    targetRevision: HEAD
    path: platform/backup/velero/schedules
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
