apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: kcm-platform
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 7.1.1
    helm:
      releaseName: velero
      valueFiles:
        - https://raw.githubusercontent.com/bunnyvalluri/church-/main/platform/backup/velero/helm/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
