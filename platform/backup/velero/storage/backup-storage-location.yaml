apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: kcm-s3-primary
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: backup-storage
    app.kubernetes.io/part-of: kcm-platform
spec:
  provider: aws
  objectStorage:
    bucket: kcm-velero-backups
    prefix: kcm-k8s-cluster
  credential:
    name: velero-s3-credentials
    key: cloud
  config:
    region: us-east-1
    s3ForcePathStyle: "false"
    serverSideEncryption: "aws:kms"
    kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/kcm-velero-backup-key"
---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: kcm-s3-secondary-dr
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: backup-storage-dr
    app.kubernetes.io/part-of: kcm-platform
spec:
  provider: aws
  accessMode: ReadOnly
  objectStorage:
    bucket: kcm-velero-backups-dr-us-west-2
    prefix: kcm-k8s-cluster
  credential:
    name: velero-s3-credentials
    key: cloud
  config:
    region: us-west-2
    s3ForcePathStyle: "false"
    serverSideEncryption: "aws:kms"
