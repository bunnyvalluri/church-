apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: velero-alert-rules
  namespace: kcm-monitoring
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: alerts
    app.kubernetes.io/part-of: kcm-platform
    role: alert-rules
spec:
  groups:
    - name: velero.rules
      rules:
        - alert: VeleroBackupFailed
          expr: velero_backup_failure_total > 0
          for: 5m
          labels:
            severity: critical
            category: backup
            project: kcm-church
          annotations:
            summary: "Velero Backup Execution Failed"
            description: "Velero backup '{{ $labels.schedule }}' failed to complete successfully on cluster {{ $labels.cluster }}."
            runbook_url: "https://github.com/bunnyvalluri/church-/tree/main/platform/backup/velero/runbooks/backup-failure-triage.md"

        - alert: VeleroRestoreFailed
          expr: velero_restore_failed_total > 0
          for: 1m
          labels:
            severity: critical
            category: disaster-recovery
            project: kcm-church
          annotations:
            summary: "Velero Restore Execution Failed"
            description: "Velero restore procedure failed in namespace {{ $labels.namespace }}."
            runbook_url: "https://github.com/bunnyvalluri/church-/tree/main/platform/backup/velero/runbooks/disaster-recovery-execution.md"

        - alert: VeleroPartialBackup
          expr: velero_backup_partial_failure_total > 0
          for: 10m
          labels:
            severity: warning
            category: backup
            project: kcm-church
          annotations:
            summary: "Velero Backup Partially Failed"
            description: "Velero backup '{{ $labels.schedule }}' finished with partial failures or skipped resources."
            runbook_url: "https://github.com/bunnyvalluri/church-/tree/main/platform/backup/velero/runbooks/backup-failure-triage.md"

        - alert: VeleroNodeAgentDown
          expr: kube_daemonset_status_number_ready{daemonset="velero-node-agent"} < kube_daemonset_status_desired_number_scheduled{daemonset="velero-node-agent"}
          for: 10m
          labels:
            severity: critical
            category: backup
            project: kcm-church
          annotations:
            summary: "Velero Node Agent DaemonSet Unhealthy"
            description: "One or more Velero Node Agent pods are not running, preventing pod volume backups."

        - alert: VeleroBackupStorageLocationUnavailable
          expr: velero_backup_storage_location_status{status="Available"} == 0
          for: 5m
          labels:
            severity: critical
            category: storage
            project: kcm-church
          annotations:
            summary: "Velero Backup Storage Location Unavailable"
            description: "Backup Storage Location '{{ $labels.name }}' is unavailable or unreachable."
            runbook_url: "https://github.com/bunnyvalluri/church-/tree/main/platform/backup/velero/runbooks/storage-exhaustion-mitigation.md"

        - alert: VeleroScheduleMissingExecution
          expr: (time() - velero_backup_last_successful_timestamp) > 90000
          for: 15m
          labels:
            severity: warning
            category: schedule
            project: kcm-church
          annotations:
            summary: "Velero Schedule Execution Stale"
            description: "Schedule '{{ $labels.schedule }}' has not produced a successful backup in over 25 hours."
