apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: longhorn-velero-bsl
  namespace: velero
spec:
  provider: aws
  objectStorage:
    bucket: kcm-church-velero-longhorn-backups
    prefix: cluster-backups
  config:
    region: us-east-1
---
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: longhorn-velero-vsl
  namespace: velero
spec:
  provider: csi
  config:
    region: us-east-1
