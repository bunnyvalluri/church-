apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "falco.name" . }}
  labels:
    {{- include "falco.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "falco.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "falco.name" . }}
    spec:
      containers:
        - name: falco
          image: "falcosecurity/falco:0.37.0"
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
