# Default values for Next.js Frontend Chart
replicaCount: 3

image:
  repository: ghcr.io/bunnyvalluri/church-/nextjs
  pullPolicy: IfNotPresent
  tag: "v2.4.0"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "nextjs-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/api/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "envoy"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: portal.kcmchurch.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nextjs-tls-cert
      hosts:
        - portal.kcmchurch.org

gateway:
  enabled: true
  gatewayName: kcm-envoy-gateway
  hostname: portal.kcmchurch.org

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 15s

env:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://api.kcmchurch.org"
  NEXT_PUBLIC_FIREBASE_API_KEY: ""
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "kcm-portal.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: "kcm-portal"

secrets:
  FIREBASE_PRIVATE_KEY: "ENCRYPTED_FIREBASE_KEY"
