# Development Overrides for Next.js Chart
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

env:
  NODE_ENV: "development"
  NEXT_PUBLIC_API_URL: "http://localhost:4000"
