configuration:
  provider: aws
  backupStorageLocation:
    bucket: kcm-velero-backups
    config:
      region: us-east-1
  volumeSnapshotLocation:
    config:
      region: us-east-1

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.9.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

schedules:
  daily-backup:
    schedule: "0 1 * * *"
    template:
      ttl: "720h"
