{{- if .Values.dbMigration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "backend.fullname" . }}-db-migrate
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "backend.fullname" . }}-db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prisma-migrate
          image: {{ .Values.dbMigration.image }}
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: {{ include "backend.fullname" . }}-secret
{{- end }}
