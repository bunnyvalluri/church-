apiVersion: v2
name: backend
description: Helm Chart for KCM Church Node.js Express Backend Service
type: application
version: 1.2.0
appVersion: "2.4.0"
keywords:
  - nodejs
  - express
  - prisma
  - backend
  - kcm-church
home: https://github.com/bunnyvalluri/church-
maintainers:
  - name: KCM Backend Team
    email: backend@kcmchurch.org
dependencies:
  - name: cloudnativepg
    version: "1.1.0"
    repository: "file://../cloudnativepg"
    condition: cloudnativepg.enabled
  - name: redis
    version: "1.0.0"
    repository: "file://../redis"
    condition: redis.enabled
  - name: kafka
    version: "1.0.0"
    repository: "file://../kafka"
    condition: kafka.enabled
  - name: nats
    version: "1.0.0"
    repository: "file://../nats"
    condition: nats.enabled
