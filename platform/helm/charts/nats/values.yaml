replicaCount: 3

config:
  jetstream:
    enabled: true
    fileStore:
      dir: /data/jetstream
      maxStore: 20Gi

persistence:
  enabled: true
  storageClass: longhorn
  size: 20Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

promExporter:
  enabled: true
