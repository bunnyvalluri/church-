replicaCount: 4

image:
  repository: ghcr.io/bunnyvalluri/kcm-frontend
  tag: "v1.2.0"

strategy:
  type: canary
  canary:
    steps:
      - setWeight: 10
      - pause: { duration: 5m }
      - setWeight: 25
      - pause: { duration: 10m }
      - setWeight: 50
      - pause: {}
      - setWeight: 75
      - pause: { duration: 5m }
      - setWeight: 100

analysis:
  enabled: true
  templates:
    - name: http-success-rate
    - name: http-latency

ingress:
  enabled: true
  host: kcmchurch.org
---
# values-bluegreen.yaml
replicaCount: 3

image:
  repository: ghcr.io/bunnyvalluri/kcm-backend
  tag: "v1.2.0"

strategy:
  type: blueGreen
  blueGreen:
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30

analysis:
  enabled: true
  templates:
    - name: db-redis-health
    - name: smoke-test-analysis

probes:
  startup:
    path: /health
    port: 3001
  liveness:
    path: /health
    port: 3001
  readiness:
    path: /health
    port: 3001
