name: Helm Publish OCI Workflow

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'platform/helm/charts/**'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.2'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Login to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package & Push OCI Charts
        run: |
          mkdir -p .cr-release-packages
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for chart in platform/helm/charts/*; do
            if [ -d "$chart" ] && [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              if grep -q "dependencies:" "$chart/Chart.yaml"; then
                echo "Building dependencies for: $chart_name"
                helm dependency build "$chart" || helm dependency update "$chart"
              fi
              echo "Packaging chart: $chart_name"
              helm package "$chart" --destination .cr-release-packages
            fi
          done

          for pkg in .cr-release-packages/*.tgz; do
            echo "Pushing OCI package: $pkg"
            helm push "$pkg" "oci://ghcr.io/${OWNER}"
          done


