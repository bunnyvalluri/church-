{{- if .Values.gatewayClass.enabled }}
# ==============================================================================
# GatewayClass — {{ .Values.gatewayClass.name }}
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{- include "kcm-gateway.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  controllerName: {{ .Values.gatewayClass.controllerName }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kcm-proxy-config
    namespace: envoy-gateway-system
{{- end }}
