# =============================================================================
# Falco ServiceAccount — Kingdom of Christ Ministries
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: falco
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/component: runtime-security
    app.kubernetes.io/part-of: kcm-security-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    security.kcm.church/description: "Falco runtime sensor service account"
    security.kcm.church/least-privilege: "true"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falcosidekick
  namespace: falco
  labels:
    app.kubernetes.io/name: falcosidekick
    app.kubernetes.io/component: event-forwarder
    app.kubernetes.io/part-of: kcm-security-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    security.kcm.church/description: "Falcosidekick event routing service account"
automountServiceAccountToken: false
