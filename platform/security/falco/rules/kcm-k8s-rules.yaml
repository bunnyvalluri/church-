# =============================================================================
# KCM Kubernetes Threat Detection Rules
# Kingdom of Christ Ministries — Enterprise Runtime Security Platform
# =============================================================================
# Rules targeting Kubernetes-specific attacks:
# Privileged pods, hostPath mounts, RBAC abuse, exec into pods,
# secrets access, service account token theft, node compromise.
# Loaded by Falco via: /etc/falco/rules.d/kcm-k8s-rules.yaml
# Source: k8s_audit (requires K8s audit log → Falco integration)
# =============================================================================

# ---------------------------------------------------------------------------
# LISTS — K8s specific
# ---------------------------------------------------------------------------

# KCM service accounts that should NOT access secrets
- list: kcm_restricted_service_accounts
  items:
    - default
    - kcm-backend
    - kcm-frontend

# Dangerous Kubernetes capabilities
- list: kcm_dangerous_capabilities
  items:
    - SYS_ADMIN
    - NET_ADMIN
    - SYS_PTRACE
    - SYS_MODULE
    - DAC_READ_SEARCH
    - DAC_OVERRIDE
    - SETUID
    - SETGID
    - FOWNER
    - CHOWN
    - SYS_RAWIO
    - MKNOD
    - AUDIT_WRITE
    - KILL

# Sensitive Kubernetes secret names
- list: kcm_sensitive_secret_names
  items:
    - kcm-secrets
    - firebase-credentials
    - stripe-secret
    - database-credentials
    - tls-secret
    - postgres-secret

# KCM namespaces to watch for privilege abuse
- list: kcm_watched_namespaces
  items:
    - kcm-system
    - kcm-prod
    - kube-system
    - argocd
    - falco
    - monitoring

# ---------------------------------------------------------------------------
# MACROS — K8s specific
# ---------------------------------------------------------------------------

- macro: kcm_k8s_audit_source
  condition: >
    evt.source = k8s_audit

- macro: kcm_pod_in_watched_namespace
  condition: >
    ka.target.namespace in (kcm_watched_namespaces)

- macro: kcm_privileged_pod_created
  condition: >
    ka.verb in (create, update, patch)
    and ka.target.resource = pods
    and ka.req.pod.containers.privileged = true

- macro: kcm_hostpath_pod_created
  condition: >
    ka.verb in (create, update, patch)
    and ka.target.resource = pods
    and ka.req.pod.volumes.hostpath exists

- macro: kcm_host_network_pod
  condition: >
    ka.verb in (create, update, patch)
    and ka.target.resource = pods
    and ka.req.pod.host_network = true

# ---------------------------------------------------------------------------
# RULES — Privileged Pod Detection
# ---------------------------------------------------------------------------

# [CRITICAL] Privileged pod created outside falco/infra namespaces
- rule: KCM Privileged Pod Created
  desc: >
    A privileged pod was created in a KCM application namespace.
    Only falco and envoy-gateway namespaces should run privileged pods.
  condition: >
    kcm_k8s_audit_source
    and kcm_privileged_pod_created
    and not ka.target.namespace in (falco, envoy-gateway-system, kube-system)
  output: >
    CRITICAL: Privileged pod created in KCM namespace
    (user=%ka.user.name ns=%ka.target.namespace
    pod=%ka.target.name verb=%ka.verb
    ua=%ka.user.groups)
  priority: CRITICAL
  tags:
    - kcm
    - k8s
    - privileged-pod
    - T1610
    - CIS-5.2.1

# [CRITICAL] HostPath mount on sensitive host path
- rule: KCM HostPath Sensitive Mount
  desc: >
    A pod was created with a HostPath volume mounting a sensitive host path.
    This is a container escape vector.
  condition: >
    kcm_k8s_audit_source
    and kcm_hostpath_pod_created
    and (
      ka.req.pod.volumes.hostpath[*].path in (/etc, /root, /var/run/docker.sock,
        /proc, /sys, /dev, /run/containerd, /run/crio)
    )
  output: >
    CRITICAL: Pod with sensitive HostPath mount created
    (user=%ka.user.name ns=%ka.target.namespace
    pod=%ka.target.name hostpath=%ka.req.pod.volumes.hostpath[*].path)
  priority: CRITICAL
  tags:
    - kcm
    - k8s
    - hostpath
    - container-escape
    - T1611
    - CIS-5.2.3

# [CRITICAL] Host Network / Host PID / Host IPC pod
- rule: KCM Host Namespace Pod Created
  desc: >
    A pod was created with host network, host PID, or host IPC enabled.
    These are container isolation bypass vectors.
  condition: >
    kcm_k8s_audit_source
    and ka.verb in (create, update, patch)
    and ka.target.resource = pods
    and not ka.target.namespace in (kube-system, falco, envoy-gateway-system)
    and (
      ka.req.pod.host_network = true
      or ka.req.pod.host_pid = true
      or ka.req.pod.host_ipc = true
    )
  output: >
    CRITICAL: Pod with host namespace access created
    (user=%ka.user.name ns=%ka.target.namespace
    pod=%ka.target.name
    host_network=%ka.req.pod.host_network
    host_pid=%ka.req.pod.host_pid
    host_ipc=%ka.req.pod.host_ipc)
  priority: CRITICAL
  tags:
    - kcm
    - k8s
    - host-namespace
    - CIS-5.2.2
    - CIS-5.2.4

# ---------------------------------------------------------------------------
# RULES — Exec into Pods
# ---------------------------------------------------------------------------

# [HIGH] kubectl exec into KCM pod
- rule: KCM Kubectl Exec Into Pod
  desc: >
    Someone used kubectl exec to get a shell in a KCM pod.
    This must be audited — only authorized operations should exec into pods.
  condition: >
    kcm_k8s_audit_source
    and ka.verb = create
    and ka.target.resource in (pods/exec, pods/attach)
    and ka.target.namespace in (kcm_namespaces)
  output: >
    HIGH: kubectl exec into KCM pod detected
    (user=%ka.user.name ns=%ka.target.namespace
    pod=%ka.target.name resource=%ka.target.resource
    ua=%ka.user.groups source_ip=%ka.source.ip)
  priority: HIGH
  tags:
    - kcm
    - k8s
    - kubectl-exec
    - T1609
    - CIS-5.7.4

# [CRITICAL] Exec into pod by non-admin user
- rule: KCM Unauthorized Exec Into Production Pod
  desc: >
    A non-admin user used kubectl exec into a production KCM pod.
    All exec operations in production must be from authorized admins only.
  condition: >
    kcm_k8s_audit_source
    and ka.verb = create
    and ka.target.resource in (pods/exec, pods/attach)
    and ka.target.namespace in (kcm-prod, kcm-system)
    and not ka.user.groups contains "system:masters"
    and not ka.user.name startswith "system:"
  output: >
    CRITICAL: Unauthorized exec into production KCM pod
    (user=%ka.user.name groups=%ka.user.groups
    ns=%ka.target.namespace pod=%ka.target.name
    source_ip=%ka.source.ip)
  priority: CRITICAL
  tags:
    - kcm
    - k8s
    - unauthorized-exec
    - production
    - T1609

# ---------------------------------------------------------------------------
# RULES — Secrets Access
# ---------------------------------------------------------------------------

# [HIGH] Secrets accessed by non-system user
- rule: KCM Secrets Read Audit
  desc: >
    A Kubernetes secret was read by a non-system account.
    KCM secrets include DB credentials, Stripe keys, Firebase service accounts.
  condition: >
    kcm_k8s_audit_source
    and ka.verb = get
    and ka.target.resource = secrets
    and ka.target.namespace in (kcm_namespaces)
    and not ka.user.name startswith "system:"
    and not ka.user.groups contains "system:masters"
  output: >
    HIGH: Kubernetes secret read by non-system user
    (user=%ka.user.name groups=%ka.user.groups
    ns=%ka.target.namespace secret=%ka.target.name
    source_ip=%ka.source.ip)
  priority: HIGH
  tags:
    - kcm
    - k8s
    - secrets-access
    - T1552.007

# [CRITICAL] Bulk secrets list (credential dump pattern)
- rule: KCM Secrets Bulk List
  desc: >
    All secrets in a KCM namespace were listed.
    Bulk listing is a common pattern in post-compromise credential collection.
  condition: >
    kcm_k8s_audit_source
    and ka.verb = list
    and ka.target.resource = secrets
    and ka.target.namespace in (kcm_namespaces)
    and not ka.user.name startswith "system:"
    and not ka.user.groups contains "system:masters"
    and not ka.user.name = "argocd-application-controller"
  output: >
    CRITICAL: Bulk Kubernetes secrets list — possible credential dump
    (user=%ka.user.name groups=%ka.user.groups
    ns=%ka.target.namespace source_ip=%ka.source.ip)
  priority: CRITICAL
  tags:
    - kcm
    - k8s
    - credential-dump
    - T1552.007

# ---------------------------------------------------------------------------
# RULES — Anonymous / Unauthenticated API Access
# ---------------------------------------------------------------------------

# [CRITICAL] Anonymous access to K8s API
- rule: KCM Anonymous Kubernetes API Access
  desc: >
    An unauthenticated (anonymous) request was made to the Kubernetes API server
    in a KCM namespace. This should never happen in production.
  condition: >
    kcm_k8s_audit_source
    and ka.user.name = "system:anonymous"
    and not ka.target.namespace in (kcm_infra_namespaces)
  output: >
    CRITICAL: Anonymous access to Kubernetes API
    (verb=%ka.verb resource=%ka.target.resource
    ns=%ka.target.namespace source_ip=%ka.source.ip)
  priority: CRITICAL
  tags:
    - kcm
    - k8s
    - anonymous-access
    - T1078.004
    - CIS-5.1.6

# ---------------------------------------------------------------------------
# RULES — RBAC Abuse
# ---------------------------------------------------------------------------

# [CRITICAL] ClusterRole/Role with wildcard permissions created
- rule: KCM RBAC Wildcard Permission Created
  desc: >
    A ClusterRole or Role with wildcard (*) permissions was created/modified.
    This grants unrestricted access and violates least-privilege principle.
  condition: >
    kcm_k8s_audit_source
    and ka.verb in (create, update, patch)
    and ka.target.resource in (clusterroles, roles)
    and (ka.req.roles.rules[*].verbs[*] = "*" or ka.req.roles.rules[*].resources[*] = "*")
    and not ka.user.name startswith "system:"
  output: >
    CRITICAL: RBAC wildcard role created
    (user=%ka.user.name role=%ka.target.name
    ns=%ka.target.namespace source_ip=%ka.source.ip)
  priority: CRITICAL
  tags:
    - kcm
    - k8s
    - rbac-abuse
    - T1078.004
    - CIS-5.1.3

# [HIGH] ClusterRoleBinding created
- rule: KCM ClusterRoleBinding Created
  desc: >
    A new ClusterRoleBinding was created. This grants cluster-wide permissions
    and should be closely audited.
  condition: >
    kcm_k8s_audit_source
    and ka.verb = create
    and ka.target.resource = clusterrolebindings
    and not ka.user.name startswith "system:"
    and not ka.user.groups contains "system:masters"
  output: >
    HIGH: ClusterRoleBinding created
    (user=%ka.user.name binding=%ka.target.name
    source_ip=%ka.source.ip)
  priority: HIGH
  tags:
    - kcm
    - k8s
    - rbac
    - T1078.004

# ---------------------------------------------------------------------------
# RULES — ServiceAccount Token Abuse
# ---------------------------------------------------------------------------

# [HIGH] ServiceAccount token read from pod filesystem
- rule: KCM ServiceAccount Token Read
  desc: >
    A process read the Kubernetes ServiceAccount token from the mounted path.
    This token can be used to authenticate to the K8s API.
  condition: >
    open_read
    and container.id != host
    and k8s.ns.name in (kcm_namespaces)
    and fd.name glob "/var/run/secrets/kubernetes.io/serviceaccount/token"
    and not proc.name in (node, kcm_trusted_processes)
  output: >
    HIGH: ServiceAccount token read by unexpected process
    (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name
    proc=%proc.name cmd=%proc.cmdline file=%fd.name)
  priority: HIGH
  tags:
    - kcm
    - k8s
    - serviceaccount-token
    - T1528

# [CRITICAL] Default service account used to access API
- rule: KCM Default ServiceAccount API Access
  desc: >
    The default service account accessed the Kubernetes API.
    Application pods should use dedicated service accounts, not 'default'.
  condition: >
    kcm_k8s_audit_source
    and ka.user.name = "system:serviceaccount:kcm-system:default"
    and ka.verb in (get, list, create, update, delete, patch)
    and ka.target.resource != ""
  output: >
    HIGH: Default service account accessing Kubernetes API
    (user=%ka.user.name verb=%ka.verb
    resource=%ka.target.resource ns=%ka.target.namespace)
  priority: HIGH
  tags:
    - kcm
    - k8s
    - default-serviceaccount
    - T1528
    - CIS-5.1.5

# ---------------------------------------------------------------------------
# RULES — Node Compromise Indicators
# ---------------------------------------------------------------------------

# [CRITICAL] Process escaped to host from container
- rule: KCM Host Process From Container
  desc: >
    A process that originated inside a container is now running on the host.
    This is a definitive container escape indicator.
  condition: >
    spawned_process
    and container.id = host
    and container.name != host
    and k8s.pod.name != ""
  output: >
    CRITICAL: Container process escaped to host
    (user=%user.name proc=%proc.name cmd=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
    ns=%k8s.ns.name host=%k8s.node.name)
  priority: CRITICAL
  tags:
    - kcm
    - k8s
    - container-escape
    - node-compromise
    - T1611

# [CRITICAL] Dangerous capability added to pod
- rule: KCM Dangerous Capability Pod Created
  desc: >
    A pod was created with a dangerous Linux capability.
    These capabilities allow privilege escalation out of container isolation.
  condition: >
    kcm_k8s_audit_source
    and ka.verb in (create, update, patch)
    and ka.target.resource = pods
    and ka.req.pod.containers.add_capabilities intersects (kcm_dangerous_capabilities)
    and not ka.target.namespace in (falco, kube-system, envoy-gateway-system)
  output: >
    CRITICAL: Pod with dangerous capability created
    (user=%ka.user.name ns=%ka.target.namespace
    pod=%ka.target.name caps=%ka.req.pod.containers.add_capabilities)
  priority: CRITICAL
  tags:
    - kcm
    - k8s
    - dangerous-capability
    - CIS-5.2.8
    - T1610
