apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-secret-scan-rules
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/part-of: kcm-security-platform
data:
  trivy-secret.yaml: |
    rules:
      - id: kcm-firebase-private-key
        category: asymmetric-key
        severity: CRITICAL
        title: Firebase Admin Private Key detected
        regex: '-----BEGIN PRIVATE KEY-----[A-Za-z0-9+/=\s]+-----END PRIVATE KEY-----'

      - id: kcm-postgres-db-url
        category: database-url
        severity: CRITICAL
        title: Hardcoded PostgreSQL Connection String detected
        regex: 'postgresql://[a-zA-Z0-9_-]+:[^@]+@[a-zA-Z0-9_.-]+:[0-9]+/[a-zA-Z0-9_-]+'

      - id: kcm-cloudinary-secret
        category: api-key
        severity: HIGH
        title: Cloudinary API Secret detected
        regex: 'cloudinary://[0-9]+:[a-zA-Z0-9_-]+@[a-zA-Z0-9_-]+'

      - id: kcm-generic-api-token
        category: token
        severity: HIGH
        title: Generic Secret Token pattern match
        regex: '(?i)(api_key|access_token|secret_key|private_key)\s*[:=]\s*["''][a-zA-Z0-9_\-]{20,}["'']'
