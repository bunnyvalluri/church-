name: Trivy Container Image & SBOM Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  build-and-scan-image:
    name: Build, Scan & SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/kcm-church/kcm-portal:${{ github.ref_name }}

      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: 'ghcr.io/kcm-church/kcm-portal:${{ github.ref_name }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: 'ghcr.io/kcm-church/kcm-portal:${{ github.ref_name }}'
          format: 'cyclonedx'
          output: 'kcm-portal-cyclonedx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: kcm-portal-cyclonedx.json
