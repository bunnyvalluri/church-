apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcm-db-sa
  namespace: kcm-database
  labels:
    app.kubernetes.io/name: kcm-postgresql
    app.kubernetes.io/part-of: kcm-database-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kcm-db-role
  namespace: kcm-database
  labels:
    app.kubernetes.io/name: kcm-postgresql
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "poolers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kcm-db-rolebinding
  namespace: kcm-database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kcm-db-role
subjects:
  - kind: ServiceAccount
    name: kcm-db-sa
    namespace: kcm-database
