apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-cluster-pod-monitor
  namespace: kcm-database
  labels:
    app.kubernetes.io/name: cnpg-monitoring
    app.kubernetes.io/part-of: kcm-database-platform
    release: prometheus
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: kcm-db-cluster
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
      path: /metrics
