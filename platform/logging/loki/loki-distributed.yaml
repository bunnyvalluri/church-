apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki-write
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: write
spec:
  replicas: 3
  serviceName: loki-write-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: write
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: write
    spec:
      serviceAccountName: loki-sa
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        imagePullPolicy: IfNotPresent
        args:
        - "-config.file=/etc/loki/loki-config.yaml"
        - "-target=write"
        ports:
        - containerPort: 3100
          name: http-metrics
        - containerPort: 9095
          name: grpc
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: data
          mountPath: /var/loki
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: config
        configMap:
          name: loki-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-read
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: read
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: read
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: read
    spec:
      serviceAccountName: loki-sa
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        args:
        - "-config.file=/etc/loki/loki-config.yaml"
        - "-target=read"
        ports:
        - containerPort: 3100
          name: http-metrics
        - containerPort: 9095
          name: grpc
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: config
        configMap:
          name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki-gateway
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
spec:
  type: ClusterIP
  ports:
  - port: 3100
    targetPort: 3100
    name: http
  selector:
    app.kubernetes.io/name: loki
