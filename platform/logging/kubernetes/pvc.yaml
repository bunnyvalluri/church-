apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-backend-pvc
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: backend
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-wal-pvc
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: ingester
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
