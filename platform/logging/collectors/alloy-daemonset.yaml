apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-collector
  namespace: logging
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: logging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy-sa
      hostNetwork: false
      dnsPolicy: ClusterFirst
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      containers:
      - name: alloy
        image: grafana/alloy:v1.0.0
        imagePullPolicy: IfNotPresent
        args:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy/data
        - /etc/alloy/config.alloy
        ports:
        - containerPort: 12345
          name: http-metrics
        securityContext:
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 0
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: alloy-data
          mountPath: /var/lib/alloy/data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: alloy-data
        emptyDir: {}
