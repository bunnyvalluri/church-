replicaCount: 2

image:
  repository: ghcr.io/bunnyvalluri/kcm-frontend
  pullPolicy: IfNotPresent
  tag: "4f3a434cede1e9a6407d44e3e7cb755a4daa0caf"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "kcm-frontend-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/api/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: portal.kcmchurch.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kcm-frontend-tls
      hosts:
        - portal.kcmchurch.org

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - kcm-frontend
          topologyKey: kubernetes.io/hostname

env:
  NODE_ENV: "production"
  PORT: "3000"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SOCKET_URL: "https://api.kcmchurch.org"

envSecrets:
  NEXTAUTH_SECRET: "ref:kcm-secrets/NEXTAUTH_SECRET"
  CLOUDINARY_API_SECRET: "ref:kcm-secrets/CLOUDINARY_API_SECRET"
