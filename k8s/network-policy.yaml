apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kcm-frontend-netpol
  namespace: kcm-system
  labels:
    app.kubernetes.io/name: kcm-frontend
spec:
  podSelector:
    matchLabels:
      app: kcm-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic from Ingress Controller / Gateway
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["ingress-nginx", "envoy-gateway", "kcm-gateway"]
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow communication to Backend API
    - to:
        - podSelector:
            matchLabels:
              app: kcm-backend-api
      ports:
        - protocol: TCP
          port: 3001
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTPS for external APIs (Neon, MongoDB Atlas, Cloudinary, Google OAuth, Resend, Razorpay)
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kcm-backend-netpol
  namespace: kcm-system
  labels:
    app.kubernetes.io/name: kcm-backend-api
spec:
  podSelector:
    matchLabels:
      app: kcm-backend-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Frontend and Ingress
    - from:
        - podSelector:
            matchLabels:
              app: kcm-frontend
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["ingress-nginx", "envoy-gateway", "kcm-gateway"]
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Allow traffic to Redis
    - to:
        - podSelector:
            matchLabels:
              app: kcm-redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTPS for external databases and APIs (PostgreSQL/Neon, Mongo, Cloudinary, Razorpay, FCM)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
