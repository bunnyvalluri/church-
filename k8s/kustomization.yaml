apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kcm-system

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - redis.yaml
  - frontend.yaml
  - backend-api.yaml
  - backend-socket.yaml
  - backend-worker.yaml
  - backend-cron.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/part-of: kcm-portal
  app.kubernetes.io/managed-by: kustomize
