apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kcm-frontend-hpa
  namespace: kcm-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kcm-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kcm-backend-api-hpa
  namespace: kcm-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kcm-backend-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80