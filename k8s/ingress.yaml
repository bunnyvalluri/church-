apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kcm-ingress
  namespace: kcm-system
  labels:
    app.kubernetes.io/name: kcm-ingress
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend-socket-service"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # ── MIGRATION STATUS ───────────────────────────────────────────────────────
    # This NGINX Ingress is DEPRECATED — migration to Envoy Gateway in progress.
    # DO NOT DELETE until Envoy Gateway validation is complete.
    # Tracking: platform/gateway/migration/migration-checklist.md
    # Replaces: platform/gateway/httproutes/ (HTTPRoute resources)
    migration.kcm/deprecated: "true"
    migration.kcm/replaced-by: "HTTPRoute/kcm-frontend-route"
    migration.kcm/status: "pending-validation"
    migration.kcm/target-gateway: "kcm-gateway"
spec:
  rules:
    - host: kcm-portal.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-api-service
                port:
                  number: 3001
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-socket-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
