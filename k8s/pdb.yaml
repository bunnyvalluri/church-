apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kcm-frontend-pdb
  namespace: kcm-system
  labels:
    app: kcm-frontend
    app.kubernetes.io/name: kcm-frontend
    app.kubernetes.io/component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kcm-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kcm-backend-api-pdb
  namespace: kcm-system
  labels:
    app: kcm-backend-api
    app.kubernetes.io/name: kcm-backend-api
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kcm-backend-api
