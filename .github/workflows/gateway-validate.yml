name: Gateway API — Validate Manifests

on:
  pull_request:
    paths:
      - "platform/gateway/**"
      - "platform/helm/kcm-gateway/**"
      - "k8s/**"
  push:
    branches: [main]
    paths:
      - "platform/gateway/**"

concurrency:
  group: "gateway-validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ── YAML Lint ────────────────────────────────────────────────────────────────
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          file_or_dir: platform/gateway/

  # ── kubeconform — Schema Validation ──────────────────────────────────────────
  kubeconform:
    name: kubeconform Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Gateway API manifests
        run: |
          kubeconform \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -summary \
            -output pretty \
            platform/gateway/

  # ── kubectl dry-run ──────────────────────────────────────────────────────────
  kubectl-dry-run:
    name: kubectl dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Create KIND cluster with Gateway API CRDs
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: "kcm-test"
          node_image: kindest/node:v1.30.0

      - name: Install Gateway API CRDs (standard channel)
        run: |
          kubectl apply -f https://github.com/envoyproxy/gateway/releases/download/v1.8.3/install.yaml --dry-run=server || true
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml

      - name: Install Envoy Gateway via Helm
        run: |
          helm install envoy-gateway oci://docker.io/envoyproxy/gateway-helm \
            --version v1.8.3 \
            --namespace envoy-gateway-system \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: dry-run Gateway resources (server-side)
        run: |
          # Create kcm-system namespace for dry-run
          kubectl create namespace kcm-system --dry-run=client -o yaml | kubectl apply -f -
          
          # Dry-run each directory
          for dir in gatewayclass gateways httproutes tls certificates policies security; do
            echo "--- Validating platform/gateway/$dir/ ---"
            kubectl apply --dry-run=server -f platform/gateway/$dir/ 2>&1 || echo "Note: some CRDs may not be installed in test cluster"
          done

  # ── Kyverno Policy Check ──────────────────────────────────────────────────────
  kyverno-policies:
    name: Kyverno Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        run: |
          curl -LO https://github.com/kyverno/kyverno/releases/download/v1.12.0/kyverno-cli_v1.12.0_linux_x86_64.tar.gz
          tar -xzf kyverno-cli_v1.12.0_linux_x86_64.tar.gz
          sudo mv kyverno /usr/local/bin/

      - name: Run Kyverno policy check
        run: |
          # Check that all resources have required labels
          kyverno apply platform/kubernetes/pod-security/ --resource platform/gateway/ || true

  # ── Summary ──────────────────────────────────────────────────────────────────
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [yaml-lint, kubeconform, kubectl-dry-run]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Gateway API Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| YAML Lint | ${{ needs.yaml-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| kubeconform | ${{ needs.kubeconform.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| kubectl dry-run | ${{ needs.kubectl-dry-run.result }} |" >> $GITHUB_STEP_SUMMARY
