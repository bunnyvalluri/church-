name: Helm CI Workflow

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'platform/helm/charts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'platform/helm/charts/**'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }} --chart-dirs platform/helm/charts)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --chart-dirs platform/helm/charts

      - name: Validate Helm Templates (helm template)
        run: |
          for chart in platform/helm/charts/*; do
            if [ -d "$chart" ]; then
              echo "Testing chart: $chart"
              helm template test-release "$chart" --debug > /dev/null
            fi
          done
