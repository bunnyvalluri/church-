name: Helm Publish OCI Workflow

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'platform/helm/charts/**'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.2'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Login to GitHub Container Registry (GHCR)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "$OWNER" --password-stdin || true

      - name: Package & Push OCI Charts
        id: package-push
        run: |
          mkdir -p .cr-release-packages
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PUSHED=0
          for chart in platform/helm/charts/*; do
            if [ -d "$chart" ] && [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              if grep -q "dependencies:" "$chart/Chart.yaml"; then
                echo "Building dependencies for: $chart_name"
                helm dependency build "$chart" || helm dependency update "$chart" || true
              fi
              echo "Packaging chart: $chart_name"
              helm package "$chart" --destination .cr-release-packages || true
            fi
          done

          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            if [ -f "$pkg" ]; then
              echo "Pushing OCI package: $pkg"
              helm push "$pkg" "oci://ghcr.io/${OWNER}" && PUSHED=$((PUSHED+1)) || true
            fi
          done

          echo "pushed_count=$PUSHED" >> $GITHUB_OUTPUT
          echo "✅ Pushed $PUSHED chart(s) to OCI registry"

      - name: Sign OCI Charts with Cosign
        if: steps.package-push.outputs.pushed_count != '0'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            if [ -f "$pkg" ]; then
              chart_name=$(basename "$pkg" .tgz)
              digest=$(helm show chart "oci://ghcr.io/${OWNER}/${chart_name%%[0-9]*}" 2>/dev/null | grep -m1 "^version:" | awk '{print $2}' || echo "")
              if [ -n "$digest" ]; then
                cosign sign --yes "ghcr.io/${OWNER}/${chart_name%%[0-9]*}:${digest}" || echo "::warning::Cosign sign skipped for $chart_name"
              fi
            fi
          done
          echo "✅ Cosign signing complete"

      - name: Publish Summary
        if: always()
        run: |
          echo "## Helm OCI Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Charts packaged and pushed to \`oci://ghcr.io/${{ github.repository_owner }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
