name: Security Secret Scanning Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1' # Weekly security baseline scan

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: false

  repository-secret-audit:
    name: KCM Zero-Trust Source Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan Working Tree for Raw Secrets
        run: |
          echo "Running zero-trust pattern checks..."
          # Fail if live AWS/Stripe/Neon/Firebase secrets are found unmasked in tracked files
          ! git grep -E "(sk_live_[0-9a-zA-Z]{24}|npg_[0-9a-zA-Z]{12}|ghp_[0-9a-zA-Z]{36})" -- ':!node_modules' ':!.git'
