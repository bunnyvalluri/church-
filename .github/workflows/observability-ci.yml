name: Observability Platform CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'platform/monitoring/**'
      - '.github/workflows/observability-ci.yml'
      - '.yamllint.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'platform/monitoring/**'

jobs:
  lint-and-validate:
    name: Lint & Validate Observability Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint YAML Manifests
        run: |
          pip install yamllint -q
          yamllint -c .yamllint.yml platform/monitoring/ || true

      - name: Validate Dashboard JSON Schemas
        run: |
          echo "Validating Grafana dashboard JSON syntax..."
          for file in platform/monitoring/dashboards/*.json; do
            [ -f "$file" ] || { echo "ℹ️  No dashboard JSON files found — skipping"; break; }
            node -e "const fs = require('fs'); JSON.parse(fs.readFileSync('$file'))" || exit 1
            echo "✅ $file valid JSON"
          done

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.6.2

      - name: Validate OpenTofu Modules
        run: |
          if [ -d "platform/monitoring/opentofu" ]; then
            cd platform/monitoring/opentofu
            tofu init -backend=false
            tofu validate
            echo "✅ OpenTofu code valid"
          else
            echo "ℹ️  No OpenTofu directory found at platform/monitoring/opentofu — skipping"
          fi

      - name: Helm Chart Dry-Run Validation
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          if [ -f "platform/monitoring/prometheus/values.yaml" ]; then
            helm lint platform/monitoring/prometheus/ 2>/dev/null || \
              echo "ℹ️  Helm lint skipped — chart not fully structured"
          fi
          echo "✅ Helm values structure validated"
