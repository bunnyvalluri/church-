name: Deployment Loop Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deployment_loop:
    name: Execute Deployment Loop Engine
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # ─── SETUP ──────────────────────────────────────────────────────────────
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ─── STAGE 1: Install Dependencies ──────────────────────────────────────
      - name: Stage 1 — Install Monorepo Dependencies
        run: |
          echo "⚡ Stage 1: Installing workspace dependencies..."
          npm ci --ignore-scripts

      - name: Stage 1b — Prisma Generate
        working-directory: ./frontend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: npx prisma generate
        continue-on-error: true

      # ─── STAGE 2: Lint ──────────────────────────────────────────────────────
      - name: Stage 2 — Run Code Linting
        run: |
          echo "⚡ Stage 2: Running ESLint code quality checks..."
          cd frontend
          npx eslint . --ext .ts,.tsx --max-warnings=50 || echo "⚠️ Lint warnings found - continuing pipeline..."
        continue-on-error: true

      # ─── STAGE 3: Build ─────────────────────────────────────────────────────
      - name: Stage 3 — Compile Next.js Production Build
        working-directory: ./frontend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-placeholder-secret-32-chars' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://kcmchurch.vercel.app' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://kcmchurch.vercel.app' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || 'placeholder' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || 'placeholder' }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || 'placeholder' }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL || '' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'placeholder' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'placeholder.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'placeholder' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'placeholder.appspot.com' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:000000000000:web:placeholder' }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY || 'placeholder' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'placeholder' }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL || 'placeholder@placeholder.iam.gserviceaccount.com' }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY || '-----BEGIN RSA PRIVATE KEY-----\nplaceholder\n-----END RSA PRIVATE KEY-----\n' }}
          PRISMA_SKIP_DATABASE_URL_VALIDATION: "1"
          SKIP_ENV_VALIDATION: "1"
          DB_OFFLINE: "true"
        run: |
          echo "⚡ Stage 3: Compiling Next.js frontend production bundle..."
          npm run build
        continue-on-error: true

      # ─── STAGE 4: Security Scan ─────────────────────────────────────────────
      - name: Stage 4 — Dependency Vulnerability Scan
        run: |
          echo "⚡ Stage 4: Running npm security vulnerability audit..."
          cd frontend
          npm audit --audit-level=critical || echo "⚠️ Security audit advisory found - review manually."
        continue-on-error: true

      # ─── STAGE 5: Vercel Deploy (via CLI — reliable, no broken Action deps) ──
      - name: Stage 5 — Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Stage 5 — Deploy to Vercel Production
        run: |
          echo "⚡ Stage 5: Deploying to Vercel Production..."
          cd frontend
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "🚀 Deploying to Vercel..."
            vercel deploy --prod --yes --token="$VERCEL_TOKEN"
            echo "✅ Vercel deployment complete!"
          else
            echo "ℹ️ VERCEL_TOKEN not set — skipping deployment."
            echo "Add VERCEL_TOKEN secret to GitHub → Settings → Secrets → Actions"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_vmrpmt6M7nQD93nU4TAY6z2b' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_OqzfPL64tlEByrAYoN1OE5C9rhuj' }}
        continue-on-error: true

      # ─── STAGE 6: Summary ───────────────────────────────────────────────────
      - name: Stage 6 — Pipeline Summary
        if: always()
        run: |
          echo "========================================"
          echo "  KCM Deployment Loop — Run Complete"
          echo "========================================"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Trigger:   ${{ github.event_name }}"
          echo "========================================"

      # ─── STAGE 7: Failure Alert ─────────────────────────────────────────────
      - name: Stage 7 — Alert on Pipeline Failure
        if: failure()
        run: |
          echo "❌ DEPLOYMENT LOOP FAILED!"
          echo "Check logs above for the failed step."
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST -H 'Content-Type: application/json' \
              -d '{"text":"🚨 [KCM Alert] Deployment Pipeline Failed! Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"}' \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi
