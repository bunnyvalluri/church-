name: Deployment Loop Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deployment_loop:
    name: Execute Deployment Loop Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Stage 1 — Run Automated Tests & Code Linting
        run: |
          echo "⚡ Stage 1: Running unit tests & linting..."
          npm run lint -w frontend

      - name: Stage 2 — Compile Next.js Production Build
        run: |
          echo "⚡ Stage 2: Compiling Next.js frontend production bundle..."
          npm run build -w frontend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Stage 3 — Run Dependency Vulnerability Scan
        run: |
          echo "⚡ Stage 3: Running npm security vulnerability audit..."
          npm audit --audit-level=critical || echo "Security audit warning: High/Critical advisories found."

      - name: Stage 4 — Lighthouse Performance & Accessibility Audit
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'
        continue-on-error: true

      - name: Stage 5 — Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        if: success()
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Stage 6 — Automated Rollback & Alert Dispatch on Failure
        if: failure()
        run: |
          echo "❌ DEPLOYMENT LOOP FAILED! Executing automated rollback strategy and alerting engineering..."
          curl -X POST -H 'Content-Type: application/json' \
            -d '{"text":"🚨 [ALERT] KCM Deployment Loop Pipeline Failed! Rollback triggered automatically."}' \
            ${{ secrets.SLACK_WEBHOOK_URL || 'https://httpbin.org/post' }}
