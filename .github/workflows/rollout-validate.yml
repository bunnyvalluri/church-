name: Validate Rollouts & Helm Charts

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'platform/**'
      - 'k8s/**'
      - '.github/workflows/rollout-*.yml'
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint platform/helm
          helm template platform/helm

      - name: Validate Kubernetes Manifests with Kubeconform
        uses: yannh/kubeconform-action@v0.8.0
        with:
          k8s-version: 'v1.29.0'
          schema-location: 'default'
          files: 'platform/rollouts/**/*.yaml'
