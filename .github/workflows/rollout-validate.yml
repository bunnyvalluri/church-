name: Validate Rollouts & Helm Charts

on:
  push:
    branches: [main, develop]
    paths:
      - 'platform/**'
      - 'k8s/**'
      - '.github/workflows/rollout-*.yml'
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Lint kcm-gateway Helm Chart
        run: |
          if [ -f "platform/helm/kcm-gateway/Chart.yaml" ]; then
            helm lint platform/helm/kcm-gateway/ --strict
            echo "✅ kcm-gateway chart lint passed"
          else
            echo "::warning::platform/helm/kcm-gateway/Chart.yaml not found — skipping helm lint"
          fi

      - name: Render Helm templates
        run: |
          if [ -f "platform/helm/kcm-gateway/Chart.yaml" ]; then
            helm template kcm-gateway platform/helm/kcm-gateway/ \
              --namespace kcm-system \
              > /tmp/rendered-gateway.yaml
            echo "✅ Helm template rendered successfully"
            wc -l /tmp/rendered-gateway.yaml
          fi

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform --version

      - name: Validate Rollout manifests
        run: |
          if ls platform/rollouts/*.yaml 1>/dev/null 2>&1; then
            kubeconform \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas \
              -summary \
              -output pretty \
              platform/rollouts/*.yaml
            echo "✅ Rollout manifests validated"
          else
            echo "::warning::No rollout YAML files found — skipping"
          fi

      - name: Validate standard K8s manifests
        run: |
          if ls k8s/*.yaml 1>/dev/null 2>&1; then
            kubeconform \
              -schema-location default \
              -ignore-missing-schemas \
              -summary \
              -output pretty \
              k8s/*.yaml || echo "::warning::Some k8s manifests have schema warnings"
            echo "✅ k8s manifests checked"
          else
            echo "::warning::No k8s YAML files found — skipping"
          fi

      - name: Summary
        run: |
          echo "## Rollouts & Helm Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All validation steps completed" >> $GITHUB_STEP_SUMMARY
          echo "- Helm chart linted and templates rendered" >> $GITHUB_STEP_SUMMARY
          echo "- Rollout manifests validated with kubeconform" >> $GITHUB_STEP_SUMMARY
          echo "- k8s manifests validated" >> $GITHUB_STEP_SUMMARY
