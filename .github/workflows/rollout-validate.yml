name: Validate Rollouts & Helm Charts

on:
  push:
    branches: [main, develop]
    paths:
      - 'platform/**'
      - 'k8s/**'
      - '.github/workflows/rollout-*.yml'
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform --version

      - name: Lint kcm-gateway Helm Chart
        run: |
          if [ -f "platform/helm/kcm-gateway/Chart.yaml" ]; then
            helm lint platform/helm/kcm-gateway/
            echo "✅ kcm-gateway chart lint passed"
          else
            echo "ℹ️  kcm-gateway chart not found — skipping"
          fi

      - name: Render Helm templates
        run: |
          if [ -f "platform/helm/kcm-gateway/Chart.yaml" ]; then
            helm template kcm-gateway platform/helm/kcm-gateway/ \
              --namespace kcm-system \
              --debug 2>&1 | grep -v "^---" | grep -c "kind:" || true
            echo "✅ Helm templates rendered successfully"
          fi

      - name: Validate Rollout manifests
        run: |
          if compgen -G "platform/rollouts/*.yaml" > /dev/null 2>&1; then
            kubeconform \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas \
              -summary \
              platform/rollouts/*.yaml
            echo "✅ Rollout manifests validated"
          else
            echo "ℹ️  No rollout YAML files found"
          fi

      - name: Validate k8s manifests
        run: |
          if compgen -G "k8s/*.yaml" > /dev/null 2>&1; then
            kubeconform \
              -schema-location default \
              -ignore-missing-schemas \
              -summary \
              k8s/*.yaml || true
            echo "✅ k8s manifests checked"
          else
            echo "ℹ️  No k8s YAML files found"
          fi

      - name: Summary
        run: |
          echo "## ✅ Rollouts & Helm Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Helm chart linted" >> $GITHUB_STEP_SUMMARY
          echo "- Rollout manifests validated" >> $GITHUB_STEP_SUMMARY
          echo "- k8s manifests validated" >> $GITHUB_STEP_SUMMARY
