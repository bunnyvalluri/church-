name: Validate Rollouts & Helm Charts

on:
  push:
    branches: [main, develop]
    paths:
      - 'platform/**'
      - 'k8s/**'
      - '.github/workflows/rollout-*.yml'
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo install -m 755 kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform kubeconform.tar.gz
          echo "✅ kubeconform ready"

      - name: Lint kcm-gateway Helm Chart
        run: |
          if [ -f "platform/helm/kcm-gateway/Chart.yaml" ]; then
            helm lint platform/helm/kcm-gateway/
            echo "✅ Helm lint passed"
          else
            echo "ℹ️  Chart.yaml not found — skipping helm lint"
          fi

      - name: Render Helm templates
        run: |
          if [ -f "platform/helm/kcm-gateway/Chart.yaml" ]; then
            helm template kcm-gateway platform/helm/kcm-gateway/ --namespace kcm-system > /dev/null
            echo "✅ Helm template render passed"
          fi

      - name: Validate Rollout manifests
        run: |
          if ls platform/rollouts/*.yaml 1>/dev/null 2>&1; then
            kubeconform \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas \
              -summary \
              platform/rollouts/*.yaml
            echo "✅ Rollout manifests validated"
          else
            echo "ℹ️  No rollout manifests found"
          fi

      - name: Validate k8s manifests
        run: |
          if ls k8s/*.yaml 1>/dev/null 2>&1; then
            kubeconform \
              -schema-location default \
              -ignore-missing-schemas \
              -summary \
              k8s/*.yaml || true
          else
            echo "ℹ️  No k8s manifests found"
          fi

      - name: Summary
        run: |
          echo "## ✅ Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Helm chart linted ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Rollout manifests validated ✅" >> $GITHUB_STEP_SUMMARY
