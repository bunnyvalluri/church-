name: Gateway — Helm Chart Lint & Test

on:
  pull_request:
    paths:
      - "platform/helm/kcm-gateway/**"
  push:
    branches: [main]
    paths:
      - "platform/helm/kcm-gateway/**"

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.0'

      - name: Helm lint (default values)
        run: helm lint platform/helm/kcm-gateway/ --strict

      - name: Helm template (default values)
        run: |
          helm template kcm-gateway platform/helm/kcm-gateway/ \
            --namespace kcm-system \
            --debug \
            > /tmp/rendered-default.yaml
          echo "Default template rendered successfully"

      - name: Validate rendered templates with kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            /tmp/rendered-default.yaml

  helm-test:
    name: Helm ct (chart-testing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Run chart-testing (lint)
        uses: helm/chart-testing-action@v2.6.1
        with:
          command: lint
          config: |
            target-branch: main
            chart-dirs: [platform/helm]
            check-version-increment: false
