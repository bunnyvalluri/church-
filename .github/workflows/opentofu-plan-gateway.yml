name: Gateway — OpenTofu Plan

on:
  pull_request:
    paths:
      - "platform/opentofu/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes (default is plan-only)"
        type: boolean
        default: false

jobs:
  tofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.apply == 'true' && 'production' || 'planning' }}
    defaults:
      run:
        working-directory: platform/opentofu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

      - name: OpenTofu Validate
        run: tofu validate

      - name: OpenTofu Plan
        id: plan
        run: |
          tofu plan \
            -var "kubeconfig_path=$HOME/.kube/config" \
            -var "letsencrypt_email=${{ secrets.LETSENCRYPT_EMAIL }}" \
            -out=gateway.tfplan \
            -no-color 2>&1 | tee /tmp/plan.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n...[truncated]' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Gateway OpenTofu Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: OpenTofu Apply
        if: ${{ github.event.inputs.apply == 'true' && github.ref == 'refs/heads/main' }}
        run: |
          tofu apply \
            -auto-approve \
            gateway.tfplan
