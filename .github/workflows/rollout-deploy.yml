name: Build, Scan & Deploy Argo Rollouts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & Push Frontend Image
        run: |
          docker build -t ghcr.io/bunnyvalluri/kcm-frontend:${{ github.sha }} -t ghcr.io/bunnyvalluri/kcm-frontend:latest -f ./docker/Dockerfile .
          docker push ghcr.io/bunnyvalluri/kcm-frontend:${{ github.sha }}
          docker push ghcr.io/bunnyvalluri/kcm-frontend:latest

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: 'ghcr.io/bunnyvalluri/kcm-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Install kubectl argo rollouts CLI
        run: |
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x ./kubectl-argo-rollouts-linux-amd64
          sudo mv ./kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      - name: Update GitOps Repository Values
        run: |
          echo "Updating Helm values in GitOps repository..."
          # Update image tags in values files
          if [ -f "kcm-church-infra/charts/kcm-frontend/values.yaml" ]; then
            sed -i 's/tag: .*/tag: "${{ github.ref_name }}"/' kcm-church-infra/charts/kcm-frontend/values.yaml
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add kcm-church-infra/
            git commit -m "chore(gitops): promote kcm-frontend to ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
            git push origin main || echo "Push skipped"
          else
            echo "ℹ️  GitOps values file not found — skipping update"
          fi
