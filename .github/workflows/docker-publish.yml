name: Build and Push Docker Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: bunnyvalluri

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Lowercase Repository Namespace & Actor
        run: |
          echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ==== FRONTEND ====
      - name: Build and push Frontend
        run: |
          docker build -t "$REGISTRY/$IMAGE_NAMESPACE/kcm-frontend:latest" -t "$REGISTRY/$IMAGE_NAMESPACE/kcm-frontend:${{ github.sha }}" -f ./docker/Dockerfile .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push "$REGISTRY/$IMAGE_NAMESPACE/kcm-frontend:latest"
            docker push "$REGISTRY/$IMAGE_NAMESPACE/kcm-frontend:${{ github.sha }}"
          fi

      # ==== BACKEND ====
      - name: Build and push Backend
        run: |
          docker build -t "$REGISTRY/$IMAGE_NAMESPACE/kcm-backend:latest" -t "$REGISTRY/$IMAGE_NAMESPACE/kcm-backend:${{ github.sha }}" -f ./backend/Dockerfile ./backend
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push "$REGISTRY/$IMAGE_NAMESPACE/kcm-backend:latest"
            docker push "$REGISTRY/$IMAGE_NAMESPACE/kcm-backend:${{ github.sha }}"
          fi

      # ==== NGINX ====
      - name: Build and push Nginx
        run: |
          docker build -t "$REGISTRY/$IMAGE_NAMESPACE/kcm-nginx:latest" -t "$REGISTRY/$IMAGE_NAMESPACE/kcm-nginx:${{ github.sha }}" -f ./nginx/Dockerfile ./nginx
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push "$REGISTRY/$IMAGE_NAMESPACE/kcm-nginx:latest"
            docker push "$REGISTRY/$IMAGE_NAMESPACE/kcm-nginx:${{ github.sha }}"
          fi
