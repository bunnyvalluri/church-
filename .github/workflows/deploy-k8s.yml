name: Deploy to Kubernetes Cluster

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: bunnyvalluri

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ==== BUILD FRONTEND ====
      - name: Build Frontend Container Image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-frontend:latest -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-frontend:${{ github.sha }} -f ./docker/Dockerfile .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-frontend:latest
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-frontend:${{ github.sha }}
          fi

      # ==== BUILD BACKEND ====
      - name: Build Backend Container Image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-backend:latest -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-backend:${{ github.sha }} -f ./backend/Dockerfile ./backend
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-backend:latest
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-backend:${{ github.sha }}
          fi

      # ==== TRIVY VULNERABILITY SCAN ====
      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-frontend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # ==== KUSTOMIZE VALIDATION ====
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Validate Kubernetes Manifests
        continue-on-error: true
        run: |
          kustomize build k8s/ > deployment-manifest.yaml && echo "✅ kustomize build OK" || echo "::warning::kustomize build had issues"

      # ==== DEPLOY TO CLUSTER ====
      - name: Set Kubernetes Context & Deploy
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        if: ${{ env.KUBE_CONFIG != '' }}
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy Manifests to Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/kcm-frontend -n kcm-system --timeout=180s
          kubectl rollout status deployment/kcm-backend-api -n kcm-system --timeout=180s
