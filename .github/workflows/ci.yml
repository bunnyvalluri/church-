name: Event Portal CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Monorepo Dependencies
        run: npm install --ignore-scripts

      - name: Prisma Generate Frontend
        working-directory: ./frontend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: npx prisma generate
        continue-on-error: true

      - name: Prisma Generate Backend
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: npx prisma generate --schema=./prisma/schema.prisma
        continue-on-error: true

      - name: Typecheck Backend (Strict TypeScript)
        working-directory: ./backend
        run: npm run typecheck

      - name: Build Backend (TypeScript Compilation)
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Architecture & Security Tests
        working-directory: ./backend
        env:
          NODE_ENV: "test"
          DB_OFFLINE: "true"
          MONGODB_OFFLINE: "true"
          DISABLE_BULLMQ: "true"
        run: npm run test

      - name: Validate Route Health & HTTP Status
        run: npm run test:route-health

      - name: Lint Frontend
        run: npm run lint -w frontend --if-present
        continue-on-error: true

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DB_OFFLINE: "true"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "placeholder"
          CLOUDINARY_API_KEY: "placeholder"
          CLOUDINARY_API_SECRET: "placeholder"
          NEXT_PUBLIC_SOCKET_URL: "http://localhost:3001"
          NEXT_PUBLIC_FIREBASE_API_KEY: "placeholder"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "placeholder.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "placeholder"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "placeholder.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:placeholder"
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: "placeholder"
          FIREBASE_PROJECT_ID: "placeholder"
          FIREBASE_CLIENT_EMAIL: "placeholder@placeholder.iam.gserviceaccount.com"
          FIREBASE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nplaceholder\n-----END RSA PRIVATE KEY-----\n"
          NEXTAUTH_SECRET: "ci-build-placeholder-secret-32-chars"
          NEXTAUTH_URL: "http://localhost:3000"
          SKIP_ENV_VALIDATION: "1"
        run: npm run build
        continue-on-error: true
