name: KCM Enterprise GitOps CI/CD Pipeline

on:
  push:
    branches: [ main, release, production ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: bunnyvalluri

jobs:
  # ── STAGE 1: Lint, Test & Quality Assurance ────────────────────────────────
  quality-assurance:
    name: Code Quality & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Prisma Schema Client Generation
        run: |
          npm run db:generate -w backend || true
          npm run db:generate -w frontend || true

      - name: Lint Frontend
        run: npm run lint -w frontend --if-present

      - name: Type Check Next.js
        run: npx tsc --noEmit --project frontend/tsconfig.json

      - name: Run Trivy Vulnerability Scanner on Source Code
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ── STAGE 2: Build & Push Hardened Multi-Arch Images to GHCR ─────────────
  build-and-push:
    name: Container Build & Push to GHCR
    needs: quality-assurance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Frontend
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-frontend:${{ github.sha }}

      # Build Backend
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kcm-backend:${{ github.sha }}

  # ── STAGE 3: GitOps Manifest Update & Argo CD Trigger ───────────────────────
  update-gitops:
    name: Update GitOps Helm Manifests
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps Repository (kcm-church-infra)
        uses: actions/checkout@v4
        with:
          repository: 'bunnyvalluri/kcm-church-infra'
          token: ${{ secrets.GITOPS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          path: 'infra'

      - name: Update Image Tags in Helm Values
        run: |
          cd infra
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' charts/kcm-frontend/values.yaml
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' charts/kcm-backend/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(gitops): promote image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
